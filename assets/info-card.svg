<svg xmlns="http://www.w3.org/2000/svg" width="490" height="330" viewBox="0 0 490 330" role="img" aria-labelledby="title desc">
<title id="title">Abdelilah MORTAKI terminal profile</title>
<desc id="desc">Neofetch-style profile card with current focus, stack, and projects.</desc>
<rect width="490" height="330" rx="14" fill="#0d1117" stroke="#30363d"/>
<circle cx="18" cy="18" r="5" fill="#ff5f56"/><circle cx="36" cy="18" r="5" fill="#ffbd2e"/><circle cx="54" cy="18" r="5" fill="#27c93f"/>
<text x="245" y="22" fill="#8b949e" font-size="10" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">mortaki@github:~</text>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.key{fill:#58a6ff;font-weight:700}.value{fill:#c9d1d9}.prompt{fill:#39d353}
@keyframes linein{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1;transform:translateX(0)}}
.line{animation:linein .32s ease-out both}
</style>
<text x="20" y="50" class="prompt" font-size="12">$ neofetch --profile</text>
<g class="line" style="animation-delay:0.18s;opacity:0">
<text x="22" y="82" class="key" font-size="11">user    </text>
<text x="92" y="82" class="value" font-size="11">Abdelilah MORTAKI</text>
</g>
<g class="line" style="animation-delay:0.28s;opacity:0">
<text x="22" y="107" class="key" font-size="11">handle  </text>
<text x="92" y="107" class="value" font-size="11">@MORTAKI0</text>
</g>
<g class="line" style="animation-delay:0.38s;opacity:0">
<text x="22" y="132" class="key" font-size="11">role    </text>
<text x="92" y="132" class="value" font-size="11">AI / Full-Stack Developer</text>
</g>
<g class="line" style="animation-delay:0.48s;opacity:0">
<text x="22" y="157" class="key" font-size="11">focus   </text>
<text x="92" y="157" class="value" font-size="11">agentic systems + developer tooling</text>
</g>
<g class="line" style="animation-delay:0.58s;opacity:0">
<text x="22" y="182" class="key" font-size="11">build   </text>
<text x="92" y="182" class="value" font-size="11">EGAWILLDOIT</text>
</g>
<g class="line" style="animation-delay:0.68s;opacity:0">
<text x="22" y="207" class="key" font-size="11">stack   </text>
<text x="92" y="207" class="value" font-size="11">TS · Python · Next.js · FastAPI</text>
</g>
<g class="line" style="animation-delay:0.78s;opacity:0">
<text x="22" y="232" class="key" font-size="11">data    </text>
<text x="92" y="232" class="value" font-size="11">Supabase · PostgreSQL</text>
</g>
<g class="line" style="animation-delay:0.88s;opacity:0">
<text x="22" y="257" class="key" font-size="11">infra   </text>
<text x="92" y="257" class="value" font-size="11">Linux · GitHub Actions · Vercel</text>
</g>
<g class="line" style="animation-delay:0.98s;opacity:0">
<text x="22" y="282" class="key" font-size="11">ship    </text>
<text x="92" y="282" class="value" font-size="11">EGA House · EGA Skills · ShipLoop</text>
</g>
<text x="20" y="315" class="prompt" font-size="11">$</text>
<rect x="31" y="305" width="7" height="12" fill="#c9d1d9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
