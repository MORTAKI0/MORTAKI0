name: Refresh Profile Dashboard

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/update_profile.py"
      - ".github/workflows/update-readme.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Refresh live profile sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile is already current."
            exit 0
          fi

          git config user.name "profile-dashboard[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile dashboard"
          git push
