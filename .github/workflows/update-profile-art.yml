name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install generator dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh contribution data and heatmap
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      - name: Refresh profile card
        if: github.event_name != 'schedule'
        run: python scripts/make_info_card.py

      - name: Refresh portrait from GitHub avatar
        if: github.event_name != 'schedule'
        run: |
          python scripts/prep_photo.py --url "https://github.com/MORTAKI0.png?size=512"
          python scripts/make_ascii_svg.py

      - name: Commit refreshed art
        run: |
          git add data/contributions.json assets/contrib-heatmap.svg assets/info-card.svg assets/mortaki-ascii.svg
          if git diff --cached --quiet; then
            echo "Profile art is already current."
            exit 0
          fi
          git config user.name "profile-art[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile art [skip ci]"
          git push
